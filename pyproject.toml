[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "0.1.0"
description = "Analyse d'emails de phishing (.eml) pour analystes SOC : SPF/DKIM/DMARC, IOC, typosquatting, rapport HTML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Souheib SID" }]
keywords = ["phishing", "soc", "email-security", "dfir", "threat-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Communications :: Email",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
phishlens = "phishlens.cli:main"

[tool.setuptools]
packages = ["phishlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

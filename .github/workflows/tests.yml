name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Tests
        run: pytest -v
      - name: Fumée CLI
        run: |
          phishlens analyze samples/newsletter_legit.eml -q
          set +e
          phishlens analyze samples/facture_phishing.eml -q
          test $? -eq 2
